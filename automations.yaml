- id: '1740411637366'
  alias: AI Event Summary (LLM Vision)
  description: ''
  use_blueprint:
    path: valentinfrlch/event_summary.yaml
    input:
      input_mode: Frigate
      notify_device: []
      camera_entities:
      - camera.frigate_front
      - camera.frigate_doorbell
      cooldown: 4
      provider: 01JMW9KMQXYDV94R6R4QYE26KW
      model: llava-phi3
      tap_navigate: /dashboard-timeline/0
      remember: true
      motion_sensors:
      - binary_sensor.frigate_front_all_occupancy
      - binary_sensor.frigate_doorbell_person_occupancy
      max_frames: 6
      preview_mode: Snapshot
      temperature: 0.2
      message: 'Summarize the events based on a series of images captured at short
        intervals. Focus only on moving subjects such as people, vehicles, and other
        active elements. Ignore static objects and scenery. Provide a clear and concise
        account of movements and interactions. Do not mention or imply the existence
        of images—present the information as if directly observing the events. If
        no movement is detected, respond with: ''No activity observed.'''
      duration: 6

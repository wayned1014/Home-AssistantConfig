    path: zanix/inovelli_blue_led_zigbee2mqtt.yaml
  icon: mdi:led-on
frigate_car_identification:
  alias: Frigate - Car Identification
  sequence:
  - data:
      prompt: A car has been detected, briefly describe the Car including its color,
        Make and Model. The notification has to be brief enough to view it on an android
        screen. If the image is black and white at night simply state that a car was
        detecting.
      image_filename: /media/camera_snapshot/snapshot.jpg
    response_variable: generated_content
    action: google_generative_ai_conversation.generate_content
  - data:
      message: '{{generated_content[''text''] }}'
    action: notify.wayne_phone_sms
    enabled: true
  mode: single
change_xfinity_channel:
  sequence:
  - repeat:
      count: '{{ channel | length }}'
      sequence:
      - action: media_player.play_media
        target:
          device_id: 56574f4f7053810d89a49fee1020dc51
        data:
          media:
            media_content_id: '{{ channel[repeat.index-1] }}'
            media_content_type: channel
            metadata: {}
      - delay:
          milliseconds: 500
  - action: remote.send_command
    target:
      device_id:
      - 56574f4f7053810d89a49fee1020dc51
    metadata: {}
    data:
      command: DPAD_CENTER
  alias: Change Xfinity Channel
  description: ''
